# JVM memory for the Gradle daemon. The defaults (512m heap / 384m metaspace)
# exhaust Metaspace on this multi-module Spring build, crashing the daemon and
# forcing a buggy no-daemon Kotlin compile fallback.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Give the Kotlin compiler daemon its own healthy heap/metaspace.
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m

# Build performance.
org.gradle.caching=true
org.gradle.parallel=true